[package]
name = "occt-wasm"
version = "3.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenCascade CAD kernel via WebAssembly — no C++ toolchain required"
readme = "README.md"
documentation = "https://docs.rs/occt-wasm"
homepage = "https://github.com/andymai/occt-wasm"
keywords = ["cad", "opencascade", "wasm", "brep", "geometry"]
categories = ["graphics", "science", "wasm"]

[dependencies]
wasmtime = "46"
brotli = "8"
thiserror = "2"

[features]
default = ["embed-module"]
# Embed the brotli-compressed kernel module via include_bytes! (the zero-config
# path). Disable to keep kernel bytes out of your artifact and supply the
# module at runtime with `OcctKernel::from_module_bytes` and friends.
embed-module = []
async = ["wasmtime/async", "dep:tokio"]

[dependencies.tokio]
version = "1"
features = ["rt"]
optional = true

[lints]
workspace = true
